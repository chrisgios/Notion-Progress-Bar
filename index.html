<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year Progress</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: transparent;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                     Helvetica, Arial, sans-serif;
        color: #3f3b36;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 18px;
    }

    .progress-card {
        width: min(760px, 100%);
        background: #f5f1e9;
        border: 1px solid #ddd6ca;
        border-radius: 18px;
        padding: 22px 24px 20px;
        box-shadow: 0 5px 18px rgba(71, 63, 52, 0.08);
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 14px;
    }

    .title {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.2px;
    }

    .dates {
        margin-top: 4px;
        font-size: 12px;
        color: #8a8277;
    }

    .percentage {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.8px;
        white-space: nowrap;
    }

    .bar {
        width: 100%;
        height: 16px;
        padding: 2px;
        background: #e2ddd3;
        border-radius: 999px;
        overflow: hidden;
    }

    .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: #9aa88b;
        transition: width 0.8s ease;
    }

    .labels {
        display: flex;
        justify-content: space-between;
        margin-top: 7px;
        font-size: 11px;
        color: #958d82;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 17px;
    }

    .stat {
        background: #ebe6dd;
        border-radius: 12px;
        padding: 10px 12px;
    }

    .stat-label {
        font-size: 10px;
        color: #91897d;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        margin-bottom: 3px;
    }

    .stat-value {
        font-size: 15px;
        font-weight: 650;
    }

    @media (max-width: 520px) {
        body {
            padding: 10px;
        }

        .progress-card {
            padding: 17px;
            border-radius: 15px;
        }

        .top {
            align-items: start;
            flex-direction: column;
            gap: 5px;
        }

        .percentage {
            font-size: 23px;
        }

        .stats {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="progress-card">
    <div class="top">
        <div>
            <div class="title">Until I See You Again</div>
            <div class="dates">May 28, 2026 — May 28, 2027</div>
        </div>

        <div class="percentage" id="percentage">0.00%</div>
    </div>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <div class="labels">
        <span>May 28, 2026</span>
        <span>May 28, 2027</span>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">Elapsed</div>
            <div class="stat-value" id="elapsed">—</div>
        </div>

        <div class="stat">
            <div class="stat-label">Remaining</div>
            <div class="stat-value" id="remaining">—</div>
        </div>

        <div class="stat">
            <div class="stat-label">Days Left</div>
            <div class="stat-value" id="daysLeft">—</div>
        </div>
    </div>
</div>

<script>
    // Your dates
    const START = new Date("2026-05-28T00:00:00");
    const END   = new Date("2027-05-28T00:00:00");

    const percentage = document.getElementById("percentage");
    const fill = document.getElementById("fill");
    const elapsed = document.getElementById("elapsed");
    const remaining = document.getElementById("remaining");
    const daysLeft = document.getElementById("daysLeft");

    const SECOND = 1000;
    const MINUTE = SECOND * 60;
    const HOUR = MINUTE * 60;
    const DAY = HOUR * 24;

    function formatDuration(ms) {
        if (ms <= 0) return "0 days";

        const days = Math.floor(ms / DAY);
        const hours = Math.floor((ms % DAY) / HOUR);
        const minutes = Math.floor((ms % HOUR) / MINUTE);
        const seconds = Math.floor((ms % MINUTE) / SECOND);

        if (days > 0) {
            return `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        return `${hours}h ${minutes}m ${seconds}s`;
    }

    function update() {
        const now = new Date();

        const total = END - START;
        const elapsedMs = Math.max(0, Math.min(now - START, total));
        const remainingMs = Math.max(0, END - now);

        const percent = Math.max(
            0,
            Math.min(100, (elapsedMs / total) * 100)
        );

        percentage.textContent = `${percent.toFixed(2)}%`;
        fill.style.width = `${percent}%`;

        elapsed.textContent = formatDuration(elapsedMs);
        remaining.textContent = formatDuration(remainingMs);
        daysLeft.textContent = Math.ceil(remainingMs / DAY).toLocaleString();
    }

    update();
    setInterval(update, 1000);
</script>

</body>
</html>
